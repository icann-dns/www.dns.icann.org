name: Verify and package site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 0.165.0
          extended: true

      - name: Build production site
        run: hugo --minify --cleanDestinationDir

      - name: Check generated site
        run: test -f public/index.html

      - name: Create site tarball
        if: startsWith(github.ref, 'refs/tags/')
        run: tar -C public -czf "dns.icann.org-${GITHUB_REF_NAME}.tar.gz" .

      - name: Upload site tarball
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: dns.icann.org-${{ github.ref_name }}
          path: dns.icann.org-${{ github.ref_name }}.tar.gz
          if-no-files-found: error